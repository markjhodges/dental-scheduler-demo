services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dental_scheduler
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: dental
    ports:
      - "5433:5432"
    volumes:
      - dental_scheduler_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental -d dental_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dental_scheduler_pgdata:
